            font-weight: 800;

        .badge-q-tag { background: #0f2c59; color: #ffd700; border: 1.5px solid #d4af37; padding: 7px 18px; border-radius: 12px; font-size: 19px; font-weight: 900; white-space: nowrap; }
        .q-text-content { font-size: 22px; font-weight: 900; color: #0f172a; line-height: 1.45; flex-grow: 1; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .option-btn { background: #f8fafc; border: 2.5px solid #cbd5e1; border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s ease; text-align: right; min-height: 64px; }

        .option-btn.wrong { background: #fef2f2 !important; border-color: #ef4444 !important; }
        .option-btn.wrong .opt-letter { background: #ef4444 !important; color: #ffffff !important; }

        function balanceQuizOptions(dataset) {
            return dataset.map((item, index) => {
                const correctText = item.options[item.correct];
                const wrongOptions = item.options.filter((_, i) => i !== item.correct);
                const shuffledWrongs = [...wrongOptions].sort(() => 0.5 - Math.random());
                const targetIndex = index % 4;
                
                const finalOptions = [];
                let wrongPtr = 0;
                for (let pos = 0; pos < 4; pos++) {
                    if (pos === targetIndex) {
                        finalOptions.push(correctText);
                    } else {
                        finalOptions.push(shuffledWrongs[wrongPtr++]);
                    }
                }
                
                return {
                    num: item.num,
                    q: item.q,
                    options: finalOptions,
                    correct: targetIndex
                };
            });
        }

        var cardsData = balanceQuizOptions(rawCardsData);
        cardsData.push({
            isConclusion: true,
            title: "تمنياتي لكم بالتوفيق والنجاح",
            subTitle: "لا يخرج منها أي اختبار"
        });

        var letters = ["أ", "ب", "ج", "د"];
        var currentIndex = 0;
        var score = 0;
        var answersState = {};

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const wrapper = document.getElementById('quiz-app-wrapper');
            canvas.width = wrapper.offsetWidth;
            canvas.height = wrapper.offsetHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);

        function render() {
            if (cardsData.length === 0) return;
            if (currentIndex >= cardsData.length) currentIndex = cardsData.length - 1;

            var item = cardsData[currentIndex];
            var totalQCount = cardsData.filter(c => !c.isConclusion).length;

            document.getElementById("progress-bar").style.width = ((currentIndex + 1) / cardsData.length * 100) + "%";
            document.getElementById("btn-prev").disabled = (currentIndex === 0);
            document.getElementById("btn-next-top").disabled = (currentIndex === cardsData.length - 1);

            var cardBody = document.getElementById("card-body-content");

            if (item.isConclusion) {
                document.getElementById("question-count").innerText = "الشريحة الختامية";
                document.getElementById("score-count").innerText = `النقاط النهائية: ${score} من ${totalQCount}`;
                
                cardBody.innerHTML = `
                    <div class="conclusion-card-box">
                        <div style="font-size: 50px; margin-bottom: 10px;">🌟🎓🌟</div>
                        <div class="conclusion-main-title">${item.title}</div>
                        <div class="conclusion-sub-tag">${item.subTitle}</div>
                    </div>
                `;
            } else {
                document.getElementById("question-count").innerText = `السؤال ${currentIndex + 1} من ${totalQCount}`;
                document.getElementById("score-count").innerText = `النقاط: ${score}`;

                var hasAnswered = answersState.hasOwnProperty(currentIndex);
                var qNumber = item.num !== undefined ? item.num : (currentIndex + 1);

                cardBody.innerHTML = `
                    <div class="question-card-container">
                        <div class="question-header-row">
                            <div class="badge-q-tag">سؤال ${qNumber}</div>
                            <div class="q-text-content">${item.q}</div>
                        </div>
                    </div>
                    <div class="options-grid" id="options-container"></div>
                `;

                var container = document.getElementById("options-container");
                for (var idx = 0; idx < item.options.length; idx++) {
                    (function(i) {
                        var btn = document.createElement("button");
                        btn.className = "option-btn";
                        var checkHtml = (hasAnswered && i === item.correct) ? '<span class="check-mark">✔</span>' : "";

                        btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span class="opt-text">${item.options[i]}</span>${checkHtml}`;

                        if (hasAnswered) {
                            btn.disabled = true;
                            if (i === item.correct) btn.className += " correct";
                            else if (i === answersState[currentIndex]) btn.className += " wrong";
                        } else {
                            btn.onclick = function() { selectOption(i); };
                        }
                        container.appendChild(btn);
                    })(idx);
                }
            }
            resizeCanvas();
        }

        function selectOption(selectedIndex) {
            if (answersState.hasOwnProperty(currentIndex)) return;
            answersState[currentIndex] = selectedIndex;
            var item = cardsData[currentIndex];

            if (selectedIndex === item.correct) {
                score++;
                document.getElementById("score-count").innerText = "النقاط: " + score;
            }
            render();
        }

        function nextQuestion() {
            if (currentIndex < cardsData.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        render();
